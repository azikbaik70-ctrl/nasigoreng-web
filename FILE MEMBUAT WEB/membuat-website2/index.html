<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, inital-scale=1">
<title>membuat web 2</title>

<style>
    .image-container img{
        width: 100px;
        height: auto;
        
    }
body {
    background-color: #f4f4f4;
    font-family: sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    padding-top: 50px;
    margin: 0;
}

body::before{
    content: "";
    background-image: url("img/windows.jpg");
    background-size: cover;
    background-repeat: no-repeat;
    opacity: 0.3;
    position: fixed;
    top: 0%;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
}

.card-sepatu {
    background-color: white;
    width: 450px;
    border-radius: 24px;
    padding: 20px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    border: 1px solid #eeeeee;
    position: relative;
}
.badge-diskon{
    position: absolute;
    top: 20px;
    left: 20px;
    background-color: #1a202c;
    color: white;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: bold;
    z-index: 10;
}

.image-container{
    background-color: #e5e7eb;
    border-radius: 16px;
    padding: 40px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 20px;
}
.info-sepatu h2{
    font-size: 20px;
    margin: 10px 0;
    color: #333;
}
.harga {
    font-size: 24px;
    font-weight: bold;
    color: #1a202c;
}
.harga span{
    text-decoration: line-through;
    color: #999;
    font-size: 16px;
    margin-left: 10px;
}
</style>
</head>
<body>
 <body>
 
  <div class="card-sepatu">
    
    <div class="badge-diskon">39% OFF</div>
     
    <div class="image-container">
       <img src="img/sepatu.jpg" alt="NIKe ari mx super">
    </div>

    <div class="info-sepatu">
       <h2>Sepatu Jordan - White</h2>
       <div class="harga">$200 <span>$300</span></div>
    </div>

  </div>
</body>

</body>
</html>
