<!DOCTYPE html>
<html>
<head>
<style>
.container{
    display: inline-grid;
    grid-template-columns: auto auto auto;
    background-color: yellow;
    gap: 5px;
    padding: 10px;
}
.container div{
    background-color: #f1f1f1;
    padding: 10px;
    text-align: center;
    font-size: 30px;
}
</style></head>
<body>
    <div class="container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
    </div>
</body>
</html>
