<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz dengan Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container" id="loginContainer">
        <h2>Masuk ke Quiz</h2>
        <input type="text" id="usernameInput" placeholder="Masukkan Username">
        <input type="password" id="passwordInput" placeholder="Masukkan Password">
        <button id="btnLogin" onclick="prosesLogin()">Masuk</button>
        <p id="pesanEror" style="display: none; background-color: #dc3545; border-left: 5px solid #721c24; color: white; text-align: center; padding: 10px; margin-top: 10px; font-size: 14px;"></p>
    </div>

    <div class="container" id="quizContainer" style="display: none;">
        <h2 id="Timer"></h2>
        <div id="btnPrev" onclick="keHalamanSebelumnya()" style="display: none; background-color: #2E4D59; text-align: center; font-weight: bold; flex: 1; padding: 10px; cursor: pointer; color: white; max-width: 60px; height: 20px;">PREV</div>
        <p id="textPertanyaan">Apa pelajaran yang membahas tentang teknologi</p>
        <h4 id="infohalaman">quest 1 or 4</h4>
        <input type="text" id="todoInput" placeholder="Pilih jawaban di bawah " readonly>
        <div id="opsiJawaban" style="display: grid; gap: 14px; padding: 0; background: none;"></div>
        <div id="kotakpenjelasan" style="display: none; background-color: #3a2a2a; border-left: 5px solid #dc3545; color: #ffcccc; padding: 12px; margin-top: 15px; border-radius: 9px; font-size: 13px;"></div>
        <button id="Tombol-lanjut" onclick="keHalamanSelanjutnya()">Lanjut soal berikutnya</button>
    </div>

    <div class="navigasi" style="display: flex; gap: 10px; margin-top: 14px;">
        <div id="btnNext" onclick="keHalamanSelanjutnya()" style="display: none; background-color: green; text-align: center; font-weight: bold;">NEXT</div>
    </div>

    <script src="username.js"></script>
    <script src="pasword.js"></script>
    <script src="script.js"></script>

</body>
</html>
